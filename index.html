<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f77b07" />
    <!--seo-head:start-->
    <!--seo-head:end-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme/language before first paint (prevents a flash). -->
    <script>
      try {
        var r = document.documentElement,
          th = localStorage.getItem('theme'),
          l = localStorage.getItem('lang'),
          path = (location.pathname || '/').replace(/\/index\.html$/, '').replace(/\/+$/, '') || '/',
          q = new URLSearchParams(location.search).get('lang');
        if (path === '/en' || q === 'en') l = 'en';
        else if (path === '/ps' || q === 'ps') l = 'ps';
        else if (q === 'fa') l = 'fa';
        if (th === 'light' || th === 'dark') r.dataset.theme = th;
        if (l === 'en') {
          r.lang = 'en';
          r.dir = 'ltr';
        } else if (l === 'ps') {
          r.lang = 'ps';
          r.dir = 'rtl';
        } else {
          r.lang = 'fa';
          r.dir = 'rtl';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!--seo-noscript:start-->
    <!--seo-noscript:end-->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
