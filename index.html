    />
    <!-- Apply the saved theme/language before first paint (prevents a flash). -->
    <script>
      try {
        var r = document.documentElement,
          th = localStorage.getItem('theme'),
          l = localStorage.getItem('lang');
        if (th === 'light' || th === 'dark') r.dataset.theme = th;
        if (l === 'en') {
          r.lang = 'en';
          r.dir = 'ltr';
        } else if (l === 'ps') {
          r.lang = 'ps';
        }
      } catch (e) {}
    </script>
